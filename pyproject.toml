[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernos"
version = "0.1.0"
description = "Refresh-aware hybrid continuous-discrete low-rank kernel learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sachin", email = "sachncs@gmail.com"},
]
keywords = ["kernel", "machine-learning", "nystrom", "ridge-regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1.0",
    "datasets>=2.0",
    "matplotlib>=3.5",
]
examples = [
    "datasets>=2.0",
    "matplotlib>=3.5",
]

[project.scripts]
kernos-eval = "examples.evaluation.cli:main"
kernos-analyze = "examples.evaluation.analyze_cli:main"

[project.urls]
Homepage = "https://github.com/sachncs/kernos"
Repository = "https://github.com/sachncs/kernos"
Issues = "https://github.com/sachncs/kernos/issues"
Changelog = "https://github.com/sachncs/kernos/blob/master/CHANGELOG.md"
Documentation = "https://github.com/sachncs/kernos/tree/master/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernos*", "examples*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py310"
lint.select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]
lint.ignore = [
    "E501",
    "N806",
    "N803",
    "N802",
    "N818",
    "E741",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow",
    "numeric: marks numeric invariant tests",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["kernos"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
