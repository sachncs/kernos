name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: Verify dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Check uv lockfile
        run: uv lock --check

  dependency-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.12
      - name: Run pip-audit
        run: uv run pip-audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.12

      - name: Run ruff check
        run: uv run ruff check kernos/ tests/ examples/ scripts/

      - name: Run ruff format check
        run: uv run ruff format --check kernos/ tests/ examples/ scripts/

      - name: Check release metadata
        run: uv run python scripts/check-version.py
      - name: Check API reference
        run: uv run python scripts/check-api-reference.py
      - name: Check grouped configuration views
        run: uv run python scripts/check-config-views.py
      - name: Check README configuration defaults
        run: uv run python scripts/check-readme-config.py

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.12
      - name: Run hooks
        run: uv run pre-commit run --all-files

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.12

      - name: Run mypy
        run: uv run mypy kernos/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install locked development environment
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run pytest tests/unit -v --no-cov

      - name: Run numeric tests
        run: uv run pytest tests/numeric -v --no-cov

      - name: Run integration tests
        run: uv run pytest tests/integration -v --no-cov

      - name: Run coverage gate
        run: |
          uv run pytest tests/ --cov=kernos --cov-report=term-missing --cov-fail-under=80 -q

  lower-bounds:
    name: Test lower dependency bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Create Python 3.10 compatibility environment
        run: uv venv --python 3.10 .venv-lower
      - name: Install declared lower dependency bounds
        run: |
          uv pip install --python .venv-lower/bin/python \
            numpy==1.24.4 scipy==1.10.1 scikit-learn==1.3.2 \
            pytest==7.4.4 pytest-cov hypothesis
          uv pip install --python .venv-lower/bin/python --no-deps -e .
      - name: Run core compatibility suites
        run: |
          .venv-lower/bin/python -m pytest tests/unit tests/numeric tests/integration -q --no-cov

  latest-dependencies:
    name: Test latest dependency releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Create latest-dependency environment
        run: uv venv --python 3.14 .venv-latest
      - name: Install latest compatible dependencies
        run: |
          uv pip install --python .venv-latest/bin/python --upgrade \
            numpy scipy scikit-learn pytest pytest-cov hypothesis
          uv pip install --python .venv-latest/bin/python --no-deps -e .
      - name: Run core compatibility suites
        run: |
          .venv-latest/bin/python -m pytest tests/unit tests/numeric tests/integration -q --no-cov

  macos-host:
    name: Test macOS host behavior
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.14
      - name: Run macOS core compatibility suites
        run: uv run pytest tests/unit tests/numeric tests/integration -q --no-cov

  windows-host:
    name: Test Windows host behavior
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.14
      - name: Run Windows core compatibility suites
        run: uv run pytest tests/unit tests/numeric tests/integration -q --no-cov

  resource-matrix:
    name: Resource benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.14
      - name: Run resource benchmark
        run: uv run python scripts/resource-benchmark.py > resource-${{ matrix.os }}.json
      - name: Upload resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: resource-benchmark-${{ matrix.os }}
          path: resource-${{ matrix.os }}.json

  resource-summary:
    name: Aggregate resource evidence
    needs: resource-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download host benchmark artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: resource-benchmark-*
          path: resource-artifacts
          merge-multiple: false
      - name: Aggregate benchmark metrics
        run: |
          mapfile -t files < <(find resource-artifacts -name '*.json' -print)
          python scripts/aggregate-resource-benchmarks.py "${files[@]}" > resource-summary.json
          cat resource-summary.json
      - name: Upload aggregate resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: resource-benchmark-summary
          path: resource-summary.json

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.12

      - name: Build wheel and source distribution
        run: |
          uv run python -m build
          uv run twine check dist/*

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/kernos-wheel-smoke
          /tmp/kernos-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/kernos-wheel-smoke/bin/python -c \
            "import kernos; from kernos import Buffer, Kernos; \
            assert kernos.__version__ == '0.2.0'; \
            assert Buffer.FULL.value == 'full'; assert Kernos.__name__ == 'Kernos'"
          /tmp/kernos-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke-wheel.py"
          cd /tmp
          set +e
          output=$(/tmp/kernos-wheel-smoke/bin/kernos-eval --datasets Diabetes 2>&1)
          exit_code=$?
          set -e
          test "$exit_code" -ne 0
          echo "$output" | grep -F "pip install 'kernos[examples]'"
